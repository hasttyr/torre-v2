# Local development infrastructure (US-003). Credentials are development-only and clearly marked.
# Start: pnpm dev:infra · Stop: pnpm dev:infra:down · Check: pnpm infra:check
# Ports are configurable through .env (see .env.example and README "Infraestructura local").
name: torre

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: torre_dev_postgres
      POSTGRES_DB: torre
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'torre']
      interval: 5s
      timeout: 3s
      retries: 20

  # Valkey 8 is the Redis-compatible engine of the deployment plan (Render Key Value, SRC-21).
  # BullMQ requires noeviction and recommends AOF persistence (SRC-22).
  redis:
    image: valkey/valkey:8.1.10
    command: ['valkey-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible storage. MinIO no longer ships community binaries or images (ADR-0003).
  s3:
    image: rustfs/rustfs:1.0.1
    command: ['/data']
    environment:
      RUSTFS_ACCESS_KEY: torre-dev-access
      RUSTFS_SECRET_KEY: torre-dev-secret-change-me
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '127.0.0.1:${S3_PORT:-9000}:9000'
      - '127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - s3-data:/data
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:9000/health']
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot job: creates the development bucket once the S3 service is healthy (US-003:AC3).
  s3-init:
    image: amazon/aws-cli:2.38.3
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: torre-dev-access
      AWS_SECRET_ACCESS_KEY: torre-dev-secret-change-me
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ['sh', '-c']
    command:
      - >-
        aws --endpoint-url http://s3:9000 s3api head-bucket --bucket torre-dev ||
        aws --endpoint-url http://s3:9000 s3api create-bucket --bucket torre-dev
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  s3-data:
