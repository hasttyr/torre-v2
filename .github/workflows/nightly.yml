# Nightly run on main (US-004:AC9, TEST-PLAN.md §6.1): 5 000 property runs with a random seed that the
# manifest records, e2e on every configured browser and benchmarks. A failure opens a defect issue.
name: Nightly

on:
  schedule:
    - cron: '0 7 * * *' # 02:00 America/Bogota
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  TZ: UTC

jobs:
  nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Nightly suite
        run: pnpm test:nightly
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-evidence-${{ github.run_id }}
          path: |
            reports/
            coverage/
          retention-days: 90
      - name: Open a defect
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const manifest = require('./reports/run-manifest.json');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `DEF: nightly failed on ${manifest.commit.slice(0, 7)} (seed ${manifest.fastCheck.seed})`,
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nReproduce: \`FC_SEED=${manifest.fastCheck.seed} FC_NUM_RUNS=${manifest.fastCheck.numRuns} pnpm test\`\n\nSuites: ${JSON.stringify(manifest.suites)}`,
              labels: ['defect', 'nightly'],
            });
