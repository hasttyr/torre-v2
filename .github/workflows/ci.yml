# Continuous integration (US-004, ARCHITECTURE.md §16.4, CONSTRAINTS.md §2).
# Branch protection on `main` must require the jobs quality, security, infra and integration (README "Integración continua").
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  FORCE_COLOR: '1'

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - name: Floor guard (CONSTRAINTS.md §1)
        run: pnpm check:floor
        env:
          FLOOR_GUARD_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
      - name: Unit and property tests with coverage
        run: pnpm test:ci
      - run: pnpm build
      - name: Run manifest and report
        if: always()
        run: pnpm test:manifest && pnpm test:report
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ github.run_id }}
          path: |
            reports/
            coverage/
          retention-days: 90

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (critical and high)
        run: pnpm audit --audit-level=high
      - name: Secrets (gitleaks, redacted)
        run: pnpm secrets --all

  infra:
    name: infra
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Start local infrastructure (US-003)
        run: pnpm dev:infra
      - name: Check every service (TC-080)
        run: pnpm infra:check
      - name: Stop
        if: always()
        run: pnpm dev:infra:down

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit coverage blob for the combined API coverage (DEC-094)
        if: hashFiles('apps/api/test/**/*.ts') != ''
        run: pnpm test:ci
      - name: API integration tests (Testcontainers)
        if: hashFiles('apps/api/test/**/*.ts') != ''
        run: pnpm test:e2e
      - name: API coverage, unit and integration together (CONSTRAINTS.md §2)
        if: hashFiles('apps/api/test/**/*.ts') != ''
        run: pnpm test:coverage
      # Here, not in quality: some criteria of DONE stories are covered only by integration tests.
      - name: Traceability over unit and integration results (TEST-PLAN.md §6.2.1)
        run: pnpm test:trace
      - name: Coverage and traceability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage/
            reports/traceability.md
          retention-days: 90
