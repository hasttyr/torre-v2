# Dependency build scripts are blocked unless approved here after reading them
# (security-and-hardening: block scripts before first execution).
# - prisma (preinstall): only checks the Node version and prints a message (read 2026-10-27, 7.10.1).
# - @prisma/engines (postinstall): downloads the schema engine that `prisma migrate` runs, from
#   Prisma's binary CDN, and fails silently (read 2026-10-27, 7.10.1; US-007).
# Denied (read 2026-10-27, dependencies of testcontainers, US-007): they are optional and the
# packages work without them.
# - ssh2 (install) and cpu-features (install): compile optional native bindings with node-gyp.
# - protobufjs (postinstall): only warns about the version scheme of its dependents.
# - msgpackr-extract (install, dependency of bullmq, US-117): builds the native extension when no
#   prebuilt platform package fits; the prebuilt one is installed, and msgpackr falls back to JavaScript.
allowBuilds:
  prisma: true
  '@prisma/engines': true
  ssh2: false
  cpu-features: false
  protobufjs: false
  msgpackr-extract: false
