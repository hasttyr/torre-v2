# Security fixes for transitive dependencies, each scoped to the vulnerable version so it stops applying
# once the parent package moves on (ADR-0001).
# - multer 2.4.0, from @nestjs/platform-express 12.2.0: GHSA-q7qp-rjg7-q26m (high, DoS), fixed in 2.5.0.
#   Remove it when Nest is upgraded to 12.3.2 or later, which already depends on multer 2.5.0.
overrides:
  'multer@2.4.0': 2.5.0

# Dependency build scripts are blocked unless approved here after reading them
# (security-and-hardening: block scripts before first execution).
# - prisma (preinstall): only checks the Node version and prints a message (read 2026-10-27, 7.10.1).
# - @prisma/engines (postinstall): downloads the schema engine that `prisma migrate` runs, from
#   Prisma's binary CDN, and fails silently (read 2026-10-27, 7.10.1; US-007).
# Denied (read 2026-10-27, dependencies of testcontainers, US-007): they are optional and the
# packages work without them.
# - ssh2 (install) and cpu-features (install): compile optional native bindings with node-gyp.
# - protobufjs (postinstall): only warns about the version scheme of its dependents.
# - msgpackr-extract (install, dependency of bullmq, US-117): builds the native extension when no
#   prebuilt platform package fits; the prebuilt one is installed, and msgpackr falls back to JavaScript.
# - vue-demi (postinstall, dependency of @tanstack/vue-query, US-009): copies its Vue 2 or Vue 3 build into
#   lib/; the published lib/ is already the Vue 3 one (checked against lib/v3 on 2026-10-27).
# - argon2 (install, US-022): compiles the native module only when no prebuilt binary fits; the package
#   ships prebuilt ones for win32-x64 and linux-x64, which node-gyp-build loads at run time.
allowBuilds:
  prisma: true
  '@prisma/engines': true
  ssh2: false
  cpu-features: false
  protobufjs: false
  msgpackr-extract: false
  vue-demi: false
  argon2: false
